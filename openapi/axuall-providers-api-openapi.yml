                $ref: '#/components/schemas/GenericErrorSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/providers/{provider_id}/verified_share:
    get:
      tags:
      - Providers
      summary: Get Provider Verified Share
      description: 'The Verified Profile endpoint allows for retrieval of the latest verified data for a

        specific provider that has granted your organization access.


        Query Parameters:

        format: Optional output format. Supported values:

        - credential_stream: Apply field transformations and institution mappings

        - (none): Return data without transformations'
      operationId: get_provider_verified_share_v2_providers__provider_id__verified_share_get
      security:
      - HTTPBearer: []
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          anyOf:
          - type: string
            minLength: 10
            maxLength: 10
            title: National Provider Identifier
            description: National Provider Identifier
            example: '1234567890'
          - type: string
            title: National Council of State Boards of Nursing
            description: National Council of State Boards of Nursing ID
            example: '12345678'
          title: Provider Id
      - name: format
        in: query
        required: false
        schema:
          type: string
          description: Output format (credential_stream)
          title: Format
        description: Output format (credential_stream)
      - name: x-axuall-actor
        in: header
        required: true
        schema:
          type: string
          format: uuid
          examples:
          - af12b4d1-6895-4f39-8215-71653a7cd4ca
          title: X-Axuall-Actor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_ShareData_'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorSchema'
        '418':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorSchema'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorSchema'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/providers/{provider_id}/changes:
    get:
      tags:
      - Providers
      summary: List Provider Credential Changes
      description: Allows for retrieval of credential changes between two dates for a provider.
      operationId: list_provider_credential_changes_v2_providers__provider_id__changes_get
      security:
      - HTTPBearer: []
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          anyOf:
          - type: string
            minLength: 10
            maxLength: 10
            title: National Provider Identifier
            description: National Provider Identifier
            example: '1234567890'
          - type: string
            title: National Council of State Boards of Nursing
            description: National Council of State Boards of Nursing ID
            example: '12345678'
          title: Provider Id
      - name: min_presented_at
        in: query
        required: true
        schema:
          type: string
          format: date
          description: Earliest date (UTC), inclusive, in range to check for changes to credentials.
          examples: '2026-09-18'
          title: Min Presented At
        description: Earliest date (UTC), inclusive, in range to check for changes to credentials.
      - name: max_presented_at
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Latest date (UTC), inclusive, in range to check for changes to credentials. If blank, then today's date.
          examples: '2026-09-25'
          title: Max Presented At
        description: Latest date (UTC), inclusive, in range to check for changes to credentials. If blank, then today's date.
      - name: x-axuall-actor
        in: header
        required: true
        schema:
          type: string
          format: uuid
          examples:
          - af12b4d1-6895-4f39-8215-71653a7cd4ca
          title: X-Axuall-Actor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Changes'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorSchema'
        '418':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorSchema'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorSchema'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/providers/{provider_id}/assign_task:
    post:
      tags:
      - Providers
      summary: Assign Task
      description: Assigns a task to a provider.
      operationId: assign_task_v2_providers__provider_id__assign_task_post
      security:
      - HTTPBearer: []
