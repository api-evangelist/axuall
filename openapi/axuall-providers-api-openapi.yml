openapi: 3.2.0
info:
  title: Axuall Providers API
  version: 2.144.89
servers:
- url: https://api.axuall.net
tags:
- name: Providers
paths:
  /v2/provider_preview:
    get:
      tags:
      - Providers
      summary: Provider Preview
      description: 'Instantly retrieve available information for a clinician.


        This can include qualified name, state licenses, dea licenses, and ABMS board certifications

        for Physicians.


        Please note this information is subject to availability and not always comprehensive.


        Only NPIs belonging to an individual clinician are supported. Organizational NPIs and

        deactivated NPIs are rejected with a 400.'
      operationId: provider_preview_v2_provider_preview_get
      security:
      - HTTPBearer: []
      parameters:
      - name: npi
        in: query
        required: true
        schema:
          type: string
          description: The NPI of the practitioner
          title: Npi
        description: The NPI of the practitioner
      - name: x-axuall-actor
        in: header
        required: true
        schema:
          type: string
          format: uuid
          examples:
          - af12b4d1-6895-4f39-8215-71653a7cd4ca
          title: X-Axuall-Actor
      responses:
        '200':
          description: '

            Successfully retrieved a complete or partial response for the clinician''s NPI

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPreviewSchema'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorSchema'
        '418':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorSchema'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorSchema'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/provider_prefill:
    get:
      tags:
      - Providers
      summary: Provider Prefill
      operationId: provider_prefill_v2_provider_prefill_get
      security:
      - HTTPBearer: []
      parameters:
      - name: provider_id
        in: query
        required: true
        schema:
          type: string
          description: Provider identifier value
          title: Provider Id
        description: Provider identifier value
      - name: id_type
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/ProviderPrefillIdType'
          description: Identifier type
        description: Identifier type
      - name: include_facilities
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Facilities
      - name: x-axuall-actor
        in: header
        required: true
        schema:
          type: string
          format: uuid
          examples:
          - af12b4d1-6895-4f39-8215-71653a7cd4ca
          title: X-Axuall-Actor
      responses:
        '200':
          description: Invite prefill payload from existing clinician or NPPES fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPrefillSchema'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorSchema'
        '418':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorSchema'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorSchema'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/providers:
    get:
      tags:
      - Providers
      summary: List Providers
      description: 'List available providers with the ability to search and filter to help find a provider.


        Provide as many of the optional query parameters as possible in order to narrow the results.'
      operationId: list_providers_v2_providers_get
      security:
      - HTTPBearer: []
      parameters:
      - name: name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          examples: Jane Smith
          title: Name
      - name: provider_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 10
            maxLength: 10
            title: National Provider Identifier
            description: National Provider Identifier
            example: '1234567890'
          - type: string
            title: National Council of State Boards of Nursing
            description: National Council of State Boards of Nursing ID
            example: '12345678'
          examples: '1730051129'
          title: Provider Id
      - name: state_license_number
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          examples: PA12345
          title: State License Number
      - name: dea_license_number
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          examples: R12345
          title: Dea License Number
      - name: date_of_birth
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[0-1][0-9]-[0-3][0-9]-[1-2][0-9]{3}
          - type: 'null'
          examples: 04-30-1990
          title: Date Of Birth
      - name: provider_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          examples: Osteopathic Physician (DO)
          title: Provider Type
      - name: registration_status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/RegistrationStatus'
          - type: 'null'
          description: Registration status of provider
          examples: account_shared
          title: Registration Status
        description: Registration status of provider
      - name: invitation_status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/InvitationStatus'
          - type: 'null'
          description: Invitation status of provider
          examples: invitation_sent
          title: Invitation Status
        description: Invitation status of provider
      - name: id_verified
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/IDVerifiedStatus'
          - type: 'null'
          description: The status of ID Verification of the provider
          examples: complete
          title: Id Verified
        description: The status of ID Verification of the provider
      - name: app_req_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: UUID of app_req_id of provider
          examples: f472da53-adee-4e5f-b59d-b2a51b63859a
          title: App Req Id
        description: UUID of app_req_id of provider
      - name: app_req_status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AppReqStatus'
          - type: 'null'
          description: The status of app_reqs to be returned/filtered. If None, returns app reqs with all statuses.
          examples: active
          title: App Req Status
        description: The status of app_reqs to be returned/filtered. If None, returns app reqs with all statuses.
      - name: min_last_wallet_shared
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Min timestamp, in UTC, of the last time a provider manually shared their wallet to a subscriber.
          examples: '2026-09-24T18:57:41.591510Z'
          title: Min Last Wallet Shared
        description: Min timestamp, in UTC, of the last time a provider manually shared their wallet to a subscriber.
      - name: max_last_wallet_shared
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Max timestamp, in UTC, of the last time a provider manually shared their wallet to a subscriber.
          examples: '2026-09-25T18:57:41.591542Z'
          title: Max Last Wallet Shared
        description: Max timestamp, in UTC, of the last time a provider manually shared their wallet to a subscriber.
      - name: min_last_share_refresh
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Min timestamp, in UTC, of when all verification jobs were completed after  a clinician shares. This timestamp indicates when a clinician is ready for import.
          examples: '2026-09-24T18:57:41.591565Z'
          title: Min Last Share Refresh
        description: Min timestamp, in UTC, of when all verification jobs were completed after  a clinician shares. This timestamp indicates when a clinician is ready for import.
      - name: max_last_share_refresh
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Max timestamp, in UTC, of when all verification jobs were completed after  a clinician shares. This timestamp indicates when a clinician is ready for import.
          examples: '2026-09-25T18:57:41.591588Z'
          title: Max Last Share Refresh
        description: Max timestamp, in UTC, of when all verification jobs were completed after  a clinician shares. This timestamp indicates when a clinician is ready for import.
      - name: min_last_task_completed_at
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Min timestamp, in UTC, of the last time a provider's task was completed.
          examples: '2026-09-24T18:57:41.591610Z'
          title: Min Last Task Completed At
        description: Min timestamp, in UTC, of the last time a provider's task was completed.
      - name: max_last_task_completed_at
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Max timestamp, in UTC, of the last time a provider's task was completed.
          examples: '2026-09-25T18:57:41.591632Z'
          title: Max Last Task Completed At
        description: Max timestamp, in UTC, of the last time a provider's task was completed.
      - name: min_last_updated
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Min timestamp, in UTC, of the last time a provider's credentials were updated.
          examples: '2026-09-24T18:57:41.591654Z'
          title: Min Last Updated
        description: Min timestamp, in UTC, of the last time a provider's credentials were updated.
      - name: max_last_updated
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Max timestamp, in UTC, of the last time a provider's credentials were updated.
          examples: '2026-09-25T18:57:41.591676Z'
          title: Max Last Updated
        description: Max timestamp, in UTC, of the last time a provider's credentials were updated.
      - name: offset
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Page offset
          default: 0
          title: Offset
        description: Page offset
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Page limit. Use -1 to disable pagination.
          default: 50
          title: Limit
        description: Page limit. Use -1 to disable pagination.
      - name: x-axuall-actor
        in: header
        required: true
        schema:
          type: string
          format: uuid
          examples:
          - af12b4d1-6895-4f39-8215-71653a7cd4ca
          title: X-Axuall-Actor
      responses:
        '200':
          description: Successfully retrieved a list of possible matches based on query parameters.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderSearchResult'
                title: Response List Providers V2 Providers Get
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorSchema'
        '418':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorSchema'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorSchema'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Providers
      summary: Register Provider
      description: 'Register a new provider with Axuall.

        If kicked off in un-engaged mode, this will trigger all possible verifications

        based on the supplied information and the chosen recipe.


        Either a NPI or NCSBN is required.'
      operationId: register_provider_v2_providers_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-axuall-actor
        in: header
        required: true
        schema:
          type: string
          format: uuid
          examples:
          - af12b4d1-6895-4f39-8215-71653a7cd4ca
          title: X-Axuall-Actor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderRegistrationRequestSchema'
      responses:
        '200':
          description: Instantiation request received.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_ProviderRegistrationMessage_'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorSchema'
        '418':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorSchema'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorSchema'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/providers/{provider_id}:
    get:
      tags:
      - Providers
      summary: Get Provider
      description: Provides identifying information for a provider
      operationId: get_provider_v2_providers__provider_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          anyOf:
          - type: string
            minLength: 10
            maxLength: 10
            title: National Provider Identifier
            description: National Provider Identifier
            example: '1234567890'
          - type: string
            title: National Council of State Boards of Nursing
            description: National Council of State Boards of Nursing ID
            example: '12345678'
          title: Provider Id
      - name: x-axuall-actor
        in: header
        required: true
        schema:
          type: string
          format: uuid
          examples:
          - af12b4d1-6895-4f39-8215-71653a7cd4ca
          title: X-Axuall-Actor
      responses:
        '200':
          description: Provider's profile information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderProfile'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorSchema'
        '418':
          description: Insufficient permissions
          content:
            application/json:
              schema:
